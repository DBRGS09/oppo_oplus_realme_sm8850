          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            echo "当前内核版本后缀：${{ github.event.inputs.kernel_suffix }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ github.event.inputs.kernel_suffix }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ github.event.inputs.kernel_suffix }}/g' ./common/arch/arm64/configs/gki_defconfig
          else
            echo "当前内核版本后缀：${{ env.KERNEL_NAME }}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${{ env.KERNEL_NAME }}\"|" "$f"
            done
            sudo sed -i 's/-4k/-${{ env.KERNEL_NAME }}/g' ./common/arch/arm64/configs/gki_defconfig
          fi
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig
          
          # 强制版本横幅里的 SMP / PREEMPT 标记（不覆盖的话 GKI 会显示成 PREEMPT_DYNAMIC）
          echo 'smp-flag-y := SMP' >> ./common/init/Makefile
          echo 'preempt-flag-y := PREEMPT' >> ./common/init/Makefile
          tail -n 4 ./common/init/Makefile
           
      - name: 构建内核
        run: |
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang19/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/rust/bin:$PATH"
          export CLANG_DIR="$WORKDIR/kernel_workspace/clang19/bin"
          CLANG_VERSION="$($CLANG_DIR/clang --version | head -n 1)"
          LLD_VERSION="$($CLANG_DIR/ld.lld --version | head -n 1)"
          RUSTC_VERSION="$(rustc -V 2>/dev/null | head -n1)"
          BINDGEN_VERSION="$(bindgen --version 2>/dev/null | head -n1)"
          echo "编译器信息:"
          echo "Clang版本: $CLANG_VERSION"
          echo "LLD版本: $LLD_VERSION"
          echo "Rustc版本: $RUSTC_VERSION"
          echo "Bindgen版本: $BINDGEN_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"
          
          # 版本横幅：构建者、构建号、构建时间
          export KBUILD_BUILD_USER="桂烁"
          export KBUILD_BUILD_HOST="aosp"
          export KBUILD_BUILD_VERSION=1
          export KBUILD_BUILD_TIMESTAMP="Tue Sep  8 15:08:49 UTC 2026"
          echo "KBUILD_BUILD_USER=$KBUILD_BUILD_USER"
          echo "KBUILD_BUILD_HOST=$KBUILD_BUILD_HOST"
          echo "KBUILD_BUILD_VERSION=$KBUILD_BUILD_VERSION"
          echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP"
          
          export CCACHE_LOGFILE="${{ github.workspace }}/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="3G"
          export CCACHE_IS_KERNEL_COMPILING="true"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$CCACHE_DIR/ccache.conf"
          
          cd kernel_workspace/common
          # fakestat/faketime：curl 重试 → git clone 兜底 → 都失败就关闭时间伪装（只影响 ccache 命中率）
          LIB_MISSING=0
          for so in libfakestat.so libfaketimeMT.so; do
            for i in 1 2 3; do
              if curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 -o "$so" \
                   "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/lib/$so" && [ -s "$so" ]; then
                break
              fi
              echo "$so 下载失败，第 $i 轮..."
              sleep 3
            done
            if [ ! -s "$so" ]; then
              echo "$so 仍不可用，改用 git clone 兜底..."
              rm -rf ../libsrc
              if timeout 300 git clone --depth=1 --filter=blob:none --sparse https://github.com/$GITHUB_REPOSITORY.git -b $GITHUB_REF_NAME ../libsrc; then
                git -C ../libsrc sparse-checkout set lib || true
                cp -f ../libsrc/lib/$so . 2>/dev/null || true
              fi
              rm -rf ../libsrc
            fi
            if [ -s "$so" ]; then
              echo "$so 就位（$(wc -c < "$so") 字节）"
            else
              LIB_MISSING=1
              rm -f "$so"
              echo "$so 没拿到"
            fi
          done
          if [ "$LIB_MISSING" = "1" ]; then
            echo "::warning title=libs-missing::fakestat/faketime 未获取到，本次关闭时间伪装（只影响 ccache 命中率，编译结果不受影响）"
          fi
          chmod 777 ./*.so 2>/dev/null || true
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
          echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
          SO_DIR=$(pwd)
          if [ "$LIB_MISSING" = "1" ]; then
            export PRELOAD_LIBS=""
          else
            export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          fi
          export REAL_CLANG_PATH="$WORKDIR/kernel_workspace/clang19/bin/clang"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache $REAL_CLANG_PATH "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          
          echo "--- [Wrapper Test] 正在创建通用的时间劫持测试脚本 ---"
          echo '#!/bin/bash' > test-wrapper.sh
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
          echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
          echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
          echo 'echo ">>> Wrapper 内部环境检查完毕."' >> test-wrapper.sh
          echo 'exec "$@"' >> test-wrapper.sh
          chmod +x test-wrapper.sh
          echo "--- [Wrapper Test] 正在测试 (date) 命令 ---"
          ./test-wrapper.sh date
          echo "--- [Wrapper Test] 正在测试 (stat) 命令 ---"
          ./test-wrapper.sh stat ./Makefile
          echo "--- [Wrapper Test] 测试完毕 ---"
          chmod +x cc-wrapper ld-wrapper
          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译前环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          
          COMMON_REAL_PATH=$(pwd -P)
          ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
          
          # 强制补齐 KernelSU 系源码（tiann / KernelSU-Next / SukiSU Nova / BakaSU）的头文件搜索路径，
          # 并把 KSU_KERNEL_DIR 用命令行变量钉成绝对路径：
          # O=out 构建时 Kbuild 里的 $(srctree)/$(src) 会被算成 ../../drivers/kernelsu，
          # 导致 preinit/runner/runner.c 这类 make 依赖直接找不到（KCFLAGS 管不到 make 依赖）
          KSU_EXTRA=""
          KSU_LINK="$COMMON_REAL_PATH/drivers/kernelsu"
          if [ -d "$KSU_LINK" ]; then
            KSU_REAL=$(readlink -f "$KSU_LINK")
            echo "KernelSU 源码真实路径: $KSU_REAL"
            KCFLAGS+=" -I$KSU_REAL -I$KSU_REAL/include -I$KSU_REAL/include/uapi -I$KSU_REAL/.."
            KSU_EXTRA="KSU_KERNEL_DIR=$KSU_REAL"
            echo "传给 make 的 KSU_KERNEL_DIR: $KSU_REAL"
            echo "---- KSU 关键文件检查 ----"
            [ -e "$KSU_REAL/include/klog.h" ] && echo "  OK  include/klog.h" || echo "  --  include/klog.h 缺失"
            [ -e "$KSU_REAL/preinit/runner/runner.c" ] && echo "  OK  preinit/runner/runner.c" || echo "  --  preinit/runner/runner.c 缺失（该分支没有 preinit runner）"
          else
            echo "提示: 未找到 drivers/kernelsu（ksu_type=none 时正常）"
          fi
          
          export RUSTC="rustc"
          export BINDGEN="bindgen"
          export CC="clang"
          export LIBCLANG_PATH="$WORKDIR/kernel_workspace/clang19/lib"
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"
          export KCFLAGS
          export HOSTCC=clang
          export LD="ld.lld"
          export HOSTLD=ld.lld
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm AS=clang READELF=llvm-readelf
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump OBJSIZE=llvm-size STRIP=llvm-strip
          source "./_setup_env.sh" 2>/dev/null || true
          
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          set -o pipefail
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig $KSU_EXTRA 2>&1 | tee ../build-defconfig.log
          
          # 为吃 usr/include 判断的 KernelSU 分支（tiann / KSUNext / Nova）安装 UAPI 头文件，
          # 否则它们会定义 KSU_NO_PREINIT 而跳过 preinit 编译，导致 SUSFS 补丁在 fs/exec.c 里引用的
          # ksu_setup_preinit_file / ksu_preinit_handle_post_execveat 变成未定义符号
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" || ${{ github.event.inputs.ksu_type }} == "ksunext" || ${{ github.event.inputs.ksu_type }} == "sukisunova" ]]; then
            if make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" O=out headers_install $KSU_EXTRA 2>&1 | tail -n 5; then
              echo "headers_install 完成"
            else
              echo "::warning title=headers-install::headers_install 失败，preinit 可能不可用"
            fi
            if [ -f out/usr/include/linux/unistd.h ]; then
              echo "out/usr/include/linux/unistd.h 已就位，KernelSU 的 preinit 会被编译"
              echo "::notice title=preinit::preinit 已启用（符号齐全）"
            else
              echo "out/usr/include/linux/unistd.h 不存在，KernelSU 可能跳过 preinit"
              echo "::notice title=preinit::preinit 未启用（可能链接报 undefined symbol）"
            fi
          fi
          
          export CC="$(pwd)/cc-wrapper" && export LD="$(pwd)/ld-wrapper"
          make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$(pwd)/cc-wrapper" LD="$(pwd)/ld-wrapper" OBJCOPY="llvm-objcopy" O=out Image $KSU_EXTRA 2>&1 | tee ../build-image.log
          
          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译后环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "内核编译完成！"
          echo "===== 内核版本串确认 ====="
          strings out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "Linux version" || echo "（未取到版本串）"
          echo "===== 内核作者信息 ====="
          strings out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "桂烁" || echo "（未取到作者串）"
          if [[ "${{ github.event.inputs.ccache_debug }}" == "true" ]]; then
            echo "正在打包ccache日志及调试信息..."
            cd ..
            cp ./common/out/vmlinux.symvers ./vmlinux.symvers
            cp ./common/out/.config ./config
            zip -r9 debug.zip ccache.log config vmlinux.symvers build-defconfig.log build-image.log
          fi
          echo "ccache状态："
          ccache -s
          echo "编译后空间:"
          df -h

      - name: 失败日志摘要
        if: failure()
        working-directory: kernel_workspace
        run: |
          found=0
          for f in build-defconfig.log build-image.log; do
            [ -f "$f" ] || continue
            found=1
            echo "===== $f ====="
            echo "--- 前 5 处真正的报错 ---"
            grep -nE "error:|Stop\.|\*\*\*" "$f" | grep -vE "^[0-9]+:make(\[[0-9]+\])?: \*\*\*" | head -n 5
            first=$(grep -nE "error:|Stop\." "$f" | head -n 1 | cut -d: -f1)
            if [ -n "$first" ]; then
              s=$(( first>25 ? first-25 : 1 ))
              echo "--- 第一处报错前后（第 $s 行起） ---"
              sed -n "${s},$(( first+5 ))p" "$f"
            fi
            echo "--- 末尾 15 行 ---"
            tail -n 15 "$f"
            grep -E "error:|Stop\.|\*\*\*" "$f" | grep -vE "^make(\[[0-9]+\])?: \*\*\*" | head -n 4 | while IFS= read -r line; do
              echo "::error title=${f}-first::$(printf '%s' "$line" | tr -d '\r' | cut -c1-380)"
            done
            if [ -n "$first" ]; then
              ctx=$(sed -n "$(( first>3 ? first-3 : 1 )),$(( first+1 ))p" "$f" | tr '\n' '|' | tr -d '\r' | cut -c1-380)
              echo "::error title=${f}-context::${ctx}"
            fi
          done
          if [ "$found" = "0" ]; then
            echo "::error title=no-build-log::构建日志不存在，失败发生在“构建内核”之前"
            for t in bc bison flex perl python3 make cc gcc ld objcopy zstd cpio rsync ccache wget aria2c; do
              p=$(command -v "$t" 2>/dev/null || echo MISSING)
              echo "::error title=tool-$t::$p"
            done
          fi

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
         
      - name: 应用KPM并修补内核
        if: inputs.kpm_enable && inputs.ksu_type != 'sukisunova'
        run: |
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/common/out/arch/arm64/boot
          KPM_OK=1
          wget -q -O kptools-linux "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux" || KPM_OK=0
          wget -q -O kpimg-linux "https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux" || KPM_OK=0
          if [ "$KPM_OK" = "1" ] && [ -s kptools-linux ] && [ -s kpimg-linux ]; then
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage || { echo "::error title=kpm-patch::KP-N 修补失败"; exit 1; }
            rm -f Image
            mv oImage Image
          else
            echo "::error title=kpm-download::KPatch-Next 工具下载失败，本次不出包（避免拿到未打 KPM 的包）"
            exit 1
          fi
          
      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        run: |
          cd kernel_workspace
          AK3_OK=0
          for i in 1 2 3; do
            rm -rf ./AnyKernel3
            if timeout 300 git clone https://github.com/cctv18/AnyKernel3 --depth=1; then
              AK3_OK=1
              break
            fi
            echo "AnyKernel3 克隆失败或超时（第 $i 轮），重试..."
            sleep 5
          done
          [ "$AK3_OK" = "1" ] || { echo "::error title=ak3-clone::AnyKernel3 克隆失败"; exit 1; }
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3
          cp ../common/out/arch/arm64/boot/Image ./Image
          if [[ ! -f ./Image ]]; then
            echo "未找到内核镜像文件，构建可能出错"
            exit 1
          fi
          
          # 把 AnyKernel3 里所有文本文件中的作者名 cctv18 统一替换为 桂烁
          grep -rIl 'cctv18' . 2>/dev/null | while IFS= read -r f; do
            sed -i 's/cctv18/桂烁/g' "$f"
            echo "作者信息已替换: $f"
          done
          echo "---- anykernel.sh 作者相关行 ----"
          grep -nE 'kernel\.string|内核构建者|桂烁' anykernel.sh || true
          
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "sukisunova" ]]; then
            KSU_TYPENAME="SukiSUNova"
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KSUNext"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="none"
          fi
          if [[ "${{ github.event.inputs.lz4kd_enable }}" == "true" ]]; then
            if ! wget -q -O zram.zip "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/zram.zip" || [ ! -s zram.zip ]; then
              echo "::error title=zram-zip::zram.zip 下载失败，本次不出包（缺少 lz4kd 的 zram 模块）"
              exit 1
            fi
          fi
          if [[ ${{ github.event.inputs.kpm_enable }} == 'true' && "${{ github.event.inputs.ksu_type }}" != "sukisunova" ]]; then
            if ! wget -q -O kpn.zip "https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip" || [ ! -s kpn.zip ]; then
              echo "::error title=kpn-zip::kpn.zip 下载失败，本次不出包"
              exit 1
            fi
            echo "已附带 KPatch-Next 模块（kpn.zip）"
          fi
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}_${{ github.event.inputs.kernel_suffix }}.zip
          else
            AK3_NAME=AnyKernel3_${KSU_TYPENAME}_${{ env.KSUVER }}_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}_${{ env.KERNEL_NAME }}.zip
          fi
          zip -r ../$AK3_NAME ./*
          echo "ak3name=$AK3_NAME" >> $GITHUB_OUTPUT
          
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
          fi
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "Author: 桂烁" > ./ak3.log
          echo "Repo: $GITHUB_REPOSITORY" >> ./ak3.log
          echo "Branch: $GITHUB_REF_NAME" >> ./ak3.log
          echo "Run ID: $GITHUB_RUN_ID" >> ./ak3.log
          echo "Commit: $GITHUB_SHA" >> ./ak3.log
          echo "Time: $TIME_NOW" >> ./ak3.log
          echo "Kernel Ver: $FULL_VERSION" >> ./ak3.log
          echo "Kernel Banner: #1 SMP PREEMPT Tue Sep  8 15:08:49 UTC 2026" >> ./ak3.log
          echo "KSU Branch: ${KSU_TYPENAME}" >> ./ak3.log
          echo "KSU Ver: ${KSUVER}" >> ./ak3.log
          echo "susfs: ${{ github.event.inputs.susfs_enable }}" >> ./ak3.log
          echo "KPM: ${{ github.event.inputs.kpm_enable }} (${KPM_MODE})" >> ./ak3.log
          echo "LZ4: ${{ github.event.inputs.lz4_enable }}" >> ./ak3.log
          echo "LZ4KD: ${{ github.event.inputs.lz4kd_enable }}" >> ./ak3.log
          echo "IPset: ${{ github.event.inputs.better_net }}" >> ./ak3.log
          echo "BBR&Brutal: ${{ github.event.inputs.bbr_enable }}" >> ./ak3.log
          echo "Droidspaces: ${{ github.event.inputs.droidspaces_enable }}" >> ./ak3.log
          echo "ADIOS: ${{ github.event.inputs.adios_enable }}" >> ./ak3.log
          echo "Re-Kernel: ${{ github.event.inputs.rekernel_enable }}" >> ./ak3.log
          echo "BBG: ${{ github.event.inputs.baseband_guard }}" >> ./ak3.log
          zip -z ../$AK3_NAME < ./ak3.log

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/debug.zip
          archive: false

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/kernel_workspace/AnyKernel*.zip
          archive: false

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
      
    steps:
      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        run: |
          CLEAN_SUB_VERSION="${{ env.SUB_VERSION }}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_mtk}"
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ github.event.inputs.kernel_suffix }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          else
            FULL_VERSION=${{ env.KERNEL_VERSION }}.${CLEAN_SUB_VERSION}-${{ env.KERNEL_NAME }}
            echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
            export FULL_VERSION=$FULL_VERSION
          fi
          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TIME_FORM=$TIME_FORM" >> $GITHUB_ENV
          TAG_HEAD="Kernel-build-桂烁"
          echo "TAG_HEAD=$TAG_HEAD" >> $GITHUB_ENV
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" ]]; then
            KSU_TYPENAME="SukiSU Ultra"
          elif [[ ${{ github.event.inputs.ksu_type }} == "sukisunova" ]]; then
            KSU_TYPENAME="SukiSU Nova"
          elif [[ ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            KSU_TYPENAME="BakaSU"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            KSU_TYPENAME="KernelSU Next"
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            KSU_TYPENAME="KSU"
          else
            KSU_TYPENAME="无内置KSU"
          fi
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> $GITHUB_ENV
         
      - name: 创建发布
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 📱 米系/其他 GKI 机型 ${KSU_TYPENAME} sm8850 通用内核 | 构建信息（作者：桂烁）
          - 内核版本号: ${{ env.FULL_VERSION }}
          - 版本横幅: #1 SMP PREEMPT Tue Sep  8 15:08:49 UTC 2026
          - 编译时间: ${{ env.TIME_FORM }}
          - 机型：骁龙8E Gen5 通用 ${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }} 内核（基于 AOSP 官方 android16-6.12-2026-03 源码分支）
          - KSU分支：${{ env.KSU_TYPENAME }}
          - KSU版本号：${{ needs.build.outputs.ksuver }}（指定版本号则内核内版本号与包名均按指定的走；留空则自动对齐官方管理器最新APK版本）
          - susfs支持：${{ github.event.inputs.susfs_enable }}
          - KPM支持 ：${{ github.event.inputs.kpm_enable }}
          - KPM实现方式：${{ needs.build.outputs.kpmmode }}
          - LZ4支持：${{ github.event.inputs.lz4_enable }}
          - LZ4KD支持：${{ github.event.inputs.lz4kd_enable }}
          - 网络功能增强：${{ github.event.inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ github.event.inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ github.event.inputs.droidspaces_enable }}
          - ADIOS IO调度器支持：${{ github.event.inputs.adios_enable }}
          - Re-Kernel支持：${{ github.event.inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ github.event.inputs.baseband_guard }}
          - BakaSU管理器下载：[BakaSU 安装说明](https://bakasu.org/zh-Hans/guide/install)
          - SukiSU Nova管理器下载：[SukiSU Nova manager-ci apks](https://cnb.cool/sukisu-nova/Release/-/tree/manager-ci/apks)
          - KernelSU Next管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KSU原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)
          
          ### ⏫️ 更新内容：
          - 更新${{ env.KSU_TYPENAME }}至最新版本（${{ needs.build.outputs.ksuver }}）
          - (预留)
          
          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备；
          2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启；
          3. 若你之前已刷入SukiSU Nova内核，可在 SukiSU Nova 管理器中直接刷入AnyKernel刷机包并重启（管理器包名为 com.sukisu.nova，与本内核匹配）；
          4. 刷入无lz4kd补丁版的内核前若刷入过lz4kd补丁版的内核，为避免出错，请先关闭zram模块；
          5. 由于KernelSU上游更新了元模块功能，最新版KSU管理器（包括除KernelSU Next以外的各分支）需要配合元模块(metamodule)才能正常挂载模块。目前的元模块包括[meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/), [meta magicmount rs](https://github.com/Tools-cx-app/meta_magic_mount/), [hybrid mount](https://github.com/YuzakiKokuban/meta-hybrid_mount)等。若你是第一次使用KSU或刚从旧版KSU管理器升级至新版，请先安装一个元模块，这样其他涉及系统挂载的模块才能正常运行；
          6. KernelPatch Next（即KPN）是一个独立于KSU的KPM实现，可以运行在任意KSU/面具环境中（不适用于Apatch），且不能与内置的kpm功能共同使用，使用前请保证你的内核没有内置的kpm实现/修补。
          
          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等软件备份boot等关键启动分区!※※※
          EOF

          gh release create "${{ env.TAG_HEAD }}-${{ env.TIME }}" \
            --repo "${{ github.repository }}" \
            --title "${{ env.TAG_HEAD }}-${{ env.FULL_VERSION }}" \
            --notes-file release_notes.md \
            release_zips/AnyKernel3_*.zip
