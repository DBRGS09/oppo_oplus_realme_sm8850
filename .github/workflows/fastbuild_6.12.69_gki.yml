name: (新版米/通用GKI) 6.12.69 GKI内核快速构建

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android16'
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '69_gki'
  KERNEL_NAME: 'android16-6-g43b5ab7e247d-abogki561813157-4k'
  CCACHE_KEY: ccache-ecsv4-gki-6.12.69
  NOVA_REPO_OWNER: 'shirkneko'
  NOVA_REPO_NAME: 'SukiSU'
  NOVA_REPO_HOST: 'https://git.zako.shirkneko.top:20004'

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(BakaSU/SukiSU Ultra/SukiSU Nova/KernelSU Next/KSU(原版)/无内置KSU,默认BakaSU)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'sukisunova'
          - 'ksunext'
          - 'ksu'
          - 'none'
      ksu_ref:
        description: '对齐的管理器版本号(纯数字,如 32680 / 33355 / 35106; 留空=自动读取官方管理器最新APK里的版本号; bakasu留空=上游最新)'
        required: false
        type: string
        default: ''
      susfs_enable:
        description: '是否开启susfs(增强隐藏环境挂载; SukiSU Nova 开启时自动使用带内置SUSFS的 clean_code 分支)'
        required: true
        type: boolean
        default: 'true'
      kpm_enable:
        description: '是否开启kpm(SukiSU Nova: 使用管理器内置的 CONFIG_KPM, 自带KPM页无需刷模块; 其他分支: 用 KpatchNext 织入内核镜像并附带 kpn.zip; 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: 'false'
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: 'false'
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能)'
        required: true
        type: boolean
        default: 'true'
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)'
        required: true
        type: boolean
        default: 'false'
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: 'true'
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
      kpmmode: ${{ steps.ksu_config.outputs.kpmmode }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-clang19工具链
        run: |
          rm -rf kernel_workspace
          mkdir kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"
          
          sudo apt-mark hold firefox || true
          sudo apt-mark hold libc-bin || true
          sudo apt-get purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update
          for i in 1 2 3; do
            sudo apt-get update && break
            echo "apt-get update 第 $i 轮失败，重试..."
            sleep 5
          done
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev bc bison flex cpio kmod rsync zstd ccache && break
            echo "apt-get install 第 $i 轮失败，重试..."
            sleep 5
          done
          
          # 安装带自动重试的 wget / aria2c 包装（/usr/local/bin 优先级高于 /usr/bin），全流程受益
          printf '%s\n' \
            '#!/bin/bash' \
            'for i in 1 2 3 4 5; do' \
            '  /usr/bin/wget --timeout=30 --tries=3 "$@" && exit 0' \
            '  echo "wget 第 $i 轮失败: $*" >&2' \
            '  sleep 5' \
            'done' \
            'echo "wget 连续失败 5 轮，放弃: $*" >&2' \
            'exit 4' | sudo tee /usr/local/bin/wget >/dev/null
          printf '%s\n' \
            '#!/bin/bash' \
            'for i in 1 2 3 4 5; do' \
            '  /usr/bin/aria2c "$@" && exit 0' \
            '  echo "aria2c 第 $i 轮失败: $*" >&2' \
            '  sleep 5' \
            'done' \
            'echo "aria2c 连续失败 5 轮，放弃: $*" >&2' \
            'exit 4' | sudo tee /usr/local/bin/aria2c >/dev/null
          sudo chmod +x /usr/local/bin/wget /usr/local/bin/aria2c
          
          # git 全局加固：慢速即判定失败、禁止交互式要账号密码，避免 clone 永久挂起
          echo "---- git 全局设置（防卡死）----"
          git config --global http.lowSpeedLimit 2000
          git config --global http.lowSpeedTime 30
          git config --global http.postBuffer 524288000
          git config --global advice.detachedHead false
          echo "GIT_TERMINAL_PROMPT=0" >> $GITHUB_ENV
          echo "GIT_ASKPASS=/bin/true" >> $GITHUB_ENV
          git config --global --list | grep -E "lowspeed|postBuffer" || true
          
          # ccache：apt 版兜底 + 尝试升级为仓库内置版本（下载失败不影响构建）
          command -v ccache >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends ccache || true
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 \
                 -o ./ccache "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/lib/ccache-x86-64"; then
              sudo cp -f ./ccache /usr/bin/ccache && sudo chmod +x /usr/bin/ccache
              echo "ccache 已升级为仓库内置版本"
              break
            fi
            echo "ccache 下载失败，第 $i 次重试..."
            sleep 5
          done
          rm -f ./ccache
          command -v ccache >/dev/null 2>&1 || { echo "::error title=ccache-missing::ccache 安装失败，无法继续"; exit 1; }
          echo "ccache 版本: $(ccache --version | head -n 1)"
          
          echo "---- 关键工具自检 ----"
          for t in bc bison flex perl python3 make cc gcc ld objcopy zstd cpio rsync ccache wget aria2c; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "$t => $(command -v "$t")"
            else
              echo "$t => 缺失"
            fi
          done
          
          echo "正在克隆源码仓库..."
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_gki_kernel_common/archive/refs/heads/android16-6.12-2026-03.zip -o common.zip && 
          unzip -q common.zip && 
          mv "android_gki_kernel_common-android16-6.12-2026-03" common &&
          rm -rf common.zip &
          
          echo "正在克隆llvm-clang19工具链..." &&
          mkdir -p clang19 &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip &&
          unzip -q clang.zip -d clang19 &&
          rm -rf clang.zip &
          
          echo "正在克隆Rust 1.82.0工具链..." &&
          mkdir -p rust &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip &&
          unzip -q rust.zip -d rust &&
          rm -rf rust.zip &
          
          echo "正在克隆构建工具..." &&
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip &&
          unzip -q build-tools.zip &&
          rm -rf build-tools.zip &
          
          wait
          
          echo "---- 校验下载结果 ----"
          miss=0
          [ -d common ] || { echo "::error title=dl-common::内核源码 common 目录缺失"; miss=1; }
          [ -x clang19/bin/clang ] || { echo "::error title=dl-clang::clang 工具链缺失"; miss=1; }
          [ -d rust/bin ] || { echo "::error title=dl-rust::rust 工具链缺失"; miss=1; }
          [ -d build-tools/bin ] || { echo "::error title=dl-buildtools::build-tools 缺失"; miss=1; }
          if [ "$miss" != "0" ]; then
            echo "下载失败，直接终止（重跑一次通常会恢复）"
            exit 1
          fi
          
          echo "所有源码及llvm-clang19工具链初始化完成！"
          echo "正在去除 dirty 后缀..."
          for f in common/scripts/setlocalversion; do
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f"
          done

      - name: 配置ccache目录
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}"
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-Droidspaces
          else
            CCACHE_REAL_KEY=${{ env.CCACHE_KEY }}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查本地缓存状态..."
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi
          
          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if [[ "${{ github.event.inputs.droidspaces_enable }}" != "false" ]]; then
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${{ env.KERNEL_VERSION }}.${{ env.SUB_VERSION }}.tar.zst"
          fi
          
          for i in 1 2 3; do
            if gh release download -p "$FILE_NAME" -R cctv18/public_ccache --clobber; then
              echo "成功下载 $FILE_NAME，正在解压..."
              tar -I zstd -xf "$FILE_NAME" -C ${{ env.CCACHE_DIR }}
              echo "公共 ccache 恢复完成！"
              break
            fi
            echo "公共 ccache 拉取失败（第 $i 轮），稍后重试或转为全新编译"
            sleep 5
          done

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }} -R ${{ github.repository }}; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi
      
      - name: 初始化并配置ccache
        run: |
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export CCACHE_MAXSIZE="${{ env.CCACHE_MAXSIZE }}"
          
          mkdir -p "$CCACHE_DIR"
          
          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true || true
          
          echo "ccache初始状态:"
          ccache -s
          
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" == 'true' ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd kernel_workspace
          GH_API="https://api.github.com"
          NOVA_API="${{ env.NOVA_REPO_HOST }}/api/v1/repos/${{ env.NOVA_REPO_OWNER }}/${{ env.NOVA_REPO_NAME }}"
          KSU_TARGET="$(echo '${{ github.event.inputs.ksu_ref }}' | tr -d '[:space:]')"
          KSU_TARGET="${KSU_TARGET#v}"
          case "$KSU_TARGET" in
            *[!0-9]*) echo "::warning title=ksu-ref::ksu_ref 只接受纯数字版本号，已忽略: $KSU_TARGET"; KSU_TARGET="" ;;
          esac
          echo "手动指定的目标版本号: ${KSU_TARGET:-（空，自动对齐官方管理器）}"
          
          # 带 token 的 GitHub API（避免 Runner 匿名限流 403 导致静默失败）
          gh_curl() {
            if [ -n "${GH_TOKEN:-}" ]; then
              curl -sL --retry 3 --retry-delay 2 --connect-timeout 20 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" "$@"
            else
              curl -sL --retry 3 --retry-delay 2 --connect-timeout 20 \
                -H "Accept: application/vnd.github+json" "$@"
            fi
          }
          
          fetch_setup() {
            local url="$1" out="$2" i
            for i in 1 2 3 4 5; do
              if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 -o "$out" "$url" \
                 && head -n 5 "$out" | grep -qE '^#!|^[[:space:]]*set '; then
                return 0
              fi
              echo "setup.sh 下载失败（第 $i 轮）: $url" >&2
              sleep 5
            done
            return 1
          }
          
          # 把 Kbuild 里算出来的版本号直接钉成指定值
          # 四个分支的 Kbuild 写法各不相同，这里一次全兼容：
          #   tiann / KernelSU-Next : $(eval KSU_VERSION=$(shell expr 30000 + $(KSU_GIT_VERSION)))
          #   BakaSU                : KSU_VERSION := $(shell expr 30000 + $(KSU_LOCAL_VERSION) + 700)
          #   SukiSU Nova           : KSU_VERSION     := $(if $(LOCAL_COUNT),$(shell expr ...),$(VERSION_BASE))
          # 只要把「KSU_VERSION 的定义行」换掉，下面无论 ccflags-y 还是 CFLAGS_init.o 都会跟着变
          force_kbuild_version() {
            local kb="$1" ver="$2"
            if [ ! -f "$kb" ]; then echo "（Kbuild 不存在，跳过强制版本: $kb）"; return 0; fi
            # 1) tiann / KernelSU-Next 的 eval 写法
            sed -i "s|^\$(eval KSU_VERSION=.*|\$(eval KSU_VERSION=${ver})|" "$kb"
            # 2) BakaSU / Nova 的 := 写法（不会误伤 KSU_VERSION_FULL / KSU_VERSION_TAG）
            sed -i "s|^\\(KSU_VERSION[[:space:]]*:=\\).*|\\1 ${ver}|" "$kb"
            # 3) KernelSU-Next 去掉 .git 后走的是 FALLBACK 分支
            sed -i "s|^\\(KSU_VERSION_FALLBACK[[:space:]]*:=\\).*|\\1 ${ver}|" "$kb"
            # 4) tiann 在无 git 时用的 16 兜底
            sed -i "s|^\\(ccflags-y += -DKSU_VERSION=\\)16$|\\1${ver}|" "$kb"
            echo "---- 内核内 KSU_VERSION 已强制为 ${ver}（$kb）----"
            grep -nE 'KSU_VERSION[[:space:]]*:=|\$\(eval KSU_VERSION=|KSU_VERSION_FALLBACK[[:space:]]*:=|DKSU_VERSION=' "$kb" | head -n 10 || true
          }
          
          # 从 GitHub latest release 的 APK 文件名里读出 5~6 位版本号
          gh_apk_version() {
            gh_curl "$GH_API/repos/$1/releases/latest" \
              | tr '{},' '\n\n\n' \
              | grep -oE '[A-Za-z0-9_.+-]+\.apk' \
              | grep -oE '[0-9]{5,6}' | sort -n | tail -n 1
          }
          
          # 版本号 → tag（离线：本地完整克隆里所有 tag 的提交数反算，不需要任何 API）
          tag_by_version_local() {
            local dir="$1" target="$2" base="$3" t c
            for t in $(git -C "$dir" tag -l 'v*' --sort=-v:refname 2>/dev/null | head -n 100); do
              c=$(git -C "$dir" rev-list --count "$t" 2>/dev/null)
              [ -n "$c" ] || continue
              if [ $((base + c)) -eq "$target" ]; then echo "$t"; return 0; fi
            done
            return 1
          }
          
          # 版本号 → tag（联网兜底：release 里找 APK 名带 _版本号- 的那个 tag）
          tag_by_version_api() {
            gh_curl "$GH_API/repos/$1/releases?per_page=100" \
              | tr '{},' '\n\n\n' \
              | sed -n 's/.*"tag_name":"\([^"]*\)".*/TAG \1/p; s/.*"name":"\([^"]*\.apk\)".*/APK \1/p' \
              | awk -v v="$2" '
                  $1=="TAG" { tag=$2 }
                  $1=="APK" { if (index($2, "_" v "-") > 0) { print tag; exit } }'
          }
          
          # 版本号 → 提交 sha（联网兜底：按「基数 + 提交数」反查第几个提交）
          commit_by_version_api() {
            local repo="$1" branch="$2" ver="$3" base="$4" total target page sha
            total=$(gh_curl -D - -o /dev/null "$GH_API/repos/$repo/commits?sha=$branch&per_page=1" \
                    | tr -d '\r' | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
            [ -n "$total" ] || return 1
            target=$(( ver - base ))
            [ "$target" -ge 1 ] || return 1
            page=$(( total - target + 1 ))
            [ "$page" -ge 1 ] || page=1
            sha=$(gh_curl "$GH_API/repos/$repo/commits?sha=$branch&per_page=1&page=$page" \
                  | grep -m1 -o '"sha":"[0-9a-f]\{40\}"' | head -n1 | sed 's/.*"sha":"//; s/"//')
            [ -n "$sha" ] || return 1
            echo "$sha"
          }
          
          # 从 CNB 的 apks 目录里读出 SukiSU Nova 管理器版本号（Nova 的 APK 只在这里发布）
          nova_apk_version() {
            curl -sL --retry 3 --connect-timeout 20 "https://cnb.cool/sukisu-nova/Release/-/tree/manager-ci/apks" \
              | grep -oE 'SukiSU_Nova[^"'"'"'<>\\]*\.apk' \
              | grep -oE '_[0-9]{5,6}-arm64' | grep -oE '[0-9]{5,6}' | sort -n | tail -n 1
          }
          
          # Nova 提交数（Gitea 的 X-Total-Count）
          nova_total() {
            curl -s -D - -o /dev/null --retry 3 --connect-timeout 20 "$NOVA_API/commits?sha=$1&limit=1" \
              | tr -d '\r' | sed -n 's/^[Xx]-[Tt]otal-[Cc]ount:[[:space:]]*\([0-9]*\).*/\1/p'
          }
          
          # Nova 版本号 → 提交 sha（基数 30996 = 30000 + 996）
          nova_commit_by_version() {
            local branch="$1" ver="$2" total target page sha
            total=$(nova_total "$branch")
            [ -n "$total" ] || return 1
            target=$(( ver - 30996 ))
            [ "$target" -ge 1 ] || return 1
            page=$(( total - target + 1 ))
            [ "$page" -ge 1 ] || page=1
            sha=$(curl -s --retry 3 --connect-timeout 20 "$NOVA_API/commits?sha=$branch&limit=1&page=$page" \
                  | grep -m1 -o '"sha":"[0-9a-f]\{40\}"' | head -n1 | sed 's/.*"sha":"//; s/"//')
            [ -n "$sha" ] || return 1
            echo "$sha"
          }
          
          if [[ ${{ github.event.inputs.ksu_type }} == "sukisu" || ${{ github.event.inputs.ksu_type }} == "bakasu" ]]; then
            echo "正在配置BakaSU（由于SukiSU长期未维护无法正常编译，且BakaSU兼容sukisu管理器，故SukiSU源码仓库已重定向为bakasu）..."
            fetch_setup "https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh" /tmp/ksu_setup.sh || { echo "::error title=ksu-setup::BakaSU setup.sh 下载失败"; exit 1; }
            bash /tmp/ksu_setup.sh main || { echo "::error title=ksu-setup::BakaSU setup.sh 执行失败"; exit 1; }
            rm -f /tmp/ksu_setup.sh
            [ -d ./KernelSU ] || { echo "::error title=ksu-setup::BakaSU 源码目录不存在"; exit 1; }
            echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@桂烁"' >> ./common/arch/arm64/configs/gki_defconfig
            cd ./KernelSU
            if [ -n "$KSU_TARGET" ]; then
              BK_TAG=$(tag_by_version_local "." "$KSU_TARGET" 30700 || true)
              BK_SHA=$(commit_by_version_api "Baka-SU/BakaSU" "main" "$KSU_TARGET" 30700 || true)
              if [ -n "$BK_TAG" ]; then
                git checkout "$BK_TAG" && echo "已把 BakaSU 切到 tag $BK_TAG（版本 $KSU_TARGET）"
              elif [ -n "$BK_SHA" ]; then
                git checkout "$BK_SHA" && echo "已把 BakaSU 切到提交 $BK_SHA（版本 $KSU_TARGET）"
              else
                echo "::warning title=ksu-ref::BakaSU 无法定位版本 $KSU_TARGET 的源码，源码保持最新（版本号仍按 $KSU_TARGET 显示）"
              fi
            else
              echo "BakaSU 未指定版本号，使用上游最新（与之前一致）"
            fi
            echo "KSU 实际提交: $(git rev-parse HEAD)"
            echo "::notice title=ksu-head::$(git rev-parse HEAD)"
            if [ -n "$KSU_TARGET" ]; then
              KSU_VERSION=$KSU_TARGET
              echo "FORCE_KSU_VER=$KSU_VERSION" >> $GITHUB_ENV
              force_kbuild_version "kernel/Kbuild" "$KSU_VERSION"
            else
              KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
            fi
            echo "KSU 版本号: $KSU_VERSION"
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "sukisunova" ]]; then
            echo "正在配置 SukiSU Nova（原 GitHub 上的 SukiSU 已停止维护，现迁移至新平台）..."
            NOVA_URL="${{ env.NOVA_REPO_HOST }}/${{ env.NOVA_REPO_OWNER }}/${{ env.NOVA_REPO_NAME }}.git"
            NOVA_ARCHIVE="${{ env.NOVA_REPO_HOST }}/${{ env.NOVA_REPO_OWNER }}/${{ env.NOVA_REPO_NAME }}/archive"
            if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
              NOVA_BRANCH="clean_code"
            else
              NOVA_BRANCH="main"
            fi
            echo "SukiSU Nova 目标分支: $NOVA_BRANCH（susfs_enable=${{ github.event.inputs.susfs_enable }}）"
            echo "仓库地址: $NOVA_URL"
            NOVA_TARGET="$KSU_TARGET"
            if [ -z "$NOVA_TARGET" ]; then
              NOVA_TARGET=$(nova_apk_version || true)
              echo "自动读取 Nova 管理器版本号（来源 CNB apks 目录）: ${NOVA_TARGET:-未取到}"
            fi
            NOVA_SHA=""
            if [ -n "$NOVA_TARGET" ]; then
              NOVA_SHA=$(nova_commit_by_version "$NOVA_BRANCH" "$NOVA_TARGET" || true)
              if [ -n "$NOVA_SHA" ]; then
                echo "版本 $NOVA_TARGET 对应 Nova 提交: $NOVA_SHA"
              else
                echo "::warning title=ksu-ref::Nova 分支 $NOVA_BRANCH 上无法定位版本 $NOVA_TARGET 的提交，源码保持分支最新（版本号仍按 $NOVA_TARGET 显示）"
              fi
            fi
            export GIT_TERMINAL_PROMPT=0
            NOVA_OK=0
            NOVA_MODE=""
            if [ -n "$NOVA_SHA" ]; then
              NOVA_MODES="full tarball"
            else
              NOVA_MODES="shallow full tarball"
            fi
            for mode in $NOVA_MODES; do
              for i in 1 2; do
                rm -rf ./KernelSU
                echo "---- Nova 获取方式: $mode（第 $i 次尝试）----"
                if [[ "$mode" == "tarball" ]]; then
                  mkdir -p ./KernelSU
                  TAR_REF="${NOVA_SHA:-$NOVA_BRANCH}"
                  if timeout 300 curl -fL --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 300 \
                       -o /tmp/nova.tar.gz "$NOVA_ARCHIVE/$TAR_REF.tar.gz" \
                     && tar -xzf /tmp/nova.tar.gz -C ./KernelSU --strip-components=1; then
                    NOVA_OK=1
                    NOVA_MODE="tarball($TAR_REF)"
                    echo "tarball 解压完成（无 .git，版本号走指定值/API 兜底）"
                    break 2
                  fi
                elif [[ "$mode" == "shallow" ]]; then
                  if timeout 420 git clone --depth=1 --single-branch --branch "$NOVA_BRANCH" "$NOVA_URL" KernelSU; then
                    NOVA_OK=1
                    NOVA_MODE="shallow"
                    break 2
                  fi
                else
                  if timeout 600 git clone --branch "$NOVA_BRANCH" "$NOVA_URL" KernelSU; then
                    NOVA_OK=1
                    NOVA_MODE="full"
                    break 2
                  fi
                fi
                echo "$mode 方式失败或超时，换下一种/重试..."
                sleep 5
              done
            done
            rm -f /tmp/nova.tar.gz
            [ "$NOVA_OK" = "1" ] || { echo "::error title=nova-clone::SukiSU Nova 三种获取方式全部失败（网络到 ${{ env.NOVA_REPO_HOST }} 不通）"; exit 1; }
            echo "Nova 获取方式最终结果: $NOVA_MODE"
            [ -d ./KernelSU/kernel ] || { echo "::error title=nova-tree::SukiSU Nova 目录结构异常（没有 kernel/ 目录）"; exit 1; }
            if [ -n "$NOVA_SHA" ] && [ -d ./KernelSU/.git ]; then
              git -C KernelSU checkout "$NOVA_SHA" && echo "已把 Nova 切到版本 $NOVA_TARGET（$NOVA_SHA）" || echo "::warning title=ksu-ref::Nova 本地切到 $NOVA_SHA 失败，继续用当前内容"
            fi
            # 关键修复：Nova 的 Kbuild 给 core/init.o 加了 -g0（去调试信息），
            # 但开启 SUSFS 后 init.o 会导出符号，ACK 的 gendwarfksyms 需要 DWARF，
            # 否则报 "dwarf_get_units failed: no debugging information?"。
            if [ -f ./KernelSU/kernel/Kbuild ]; then
              sed -i 's/\(^\|[[:space:]]\)-g0\b/-g/g' ./KernelSU/kernel/Kbuild
              echo "---- Nova Kbuild -g0 处理结果 ----"
              grep -n -- "-g0" ./KernelSU/kernel/Kbuild || echo "已无 -g0 残留"
              grep -n "CFLAGS_init.o += -g" ./KernelSU/kernel/Kbuild || echo "（未匹配到 -g 行，Kbuild 结构可能变了）"
            fi
            # 手动建立符号链接与 Kconfig/Makefile 挂钩（其自带 setup.sh 的 clone 地址写错，不能直接跑）
            DRV="./common/drivers"
            rm -f "$DRV/kernelsu"
            ln -sfn "$(realpath --relative-to="$DRV" "$(pwd)/KernelSU/kernel")" "$DRV/kernelsu"
            grep -q "kernelsu" "$DRV/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRV/Makefile"
            grep -q "drivers/kernelsu/Kconfig" "$DRV/Kconfig" || printf '\nsource "drivers/kernelsu/Kconfig"\n' >> "$DRV/Kconfig"
            echo "---- 链接检查 ----"
            ls -l "$DRV/kernelsu"
            tail -n 2 "$DRV/Makefile"
            tail -n 2 "$DRV/Kconfig"
            echo "Nova 当前提交: $(git -C KernelSU rev-parse HEAD 2>/dev/null || echo '无 .git（tarball 模式）')"
            echo "Nova 当前分支: $(git -C KernelSU rev-parse --abbrev-ref HEAD 2>/dev/null || echo "$NOVA_BRANCH（tarball 模式）")"
            echo "::notice title=ksu-head::$(git -C KernelSU rev-parse HEAD 2>/dev/null || echo "tarball-$NOVA_BRANCH")"
            if [ -n "$NOVA_TARGET" ]; then
              KSU_VERSION=$NOVA_TARGET
            else
              # 管理器版本号对应的是 main 分支的提交数（clean_code 分支提交数更少，会算出偏小的号）
              N_MAIN=$(nova_total "main")
              [ -n "$N_MAIN" ] || N_MAIN=$(nova_total "$NOVA_BRANCH")
              [ -n "$N_MAIN" ] || N_MAIN=$(git -C KernelSU rev-list --count HEAD 2>/dev/null || echo 1)
              echo "Nova main 提交计数: $N_MAIN"
              KSU_VERSION=$((30000 + N_MAIN + 996))
            fi
            echo "KSU 版本号: $KSU_VERSION"
            echo "FORCE_KSU_VER=$KSU_VERSION" >> $GITHUB_ENV
            force_kbuild_version "./KernelSU/kernel/Kbuild" "$KSU_VERSION"
            echo "NOVA_BRANCH=$NOVA_BRANCH" >> $GITHUB_ENV
            echo "KSU_BUILD_REF=桂烁" >> $GITHUB_ENV
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在配置KernelSU Next..."
            KSUN_TARGET="$KSU_TARGET"
            if [ -z "$KSUN_TARGET" ]; then
              KSUN_TARGET=$(gh_apk_version "KernelSU-Next/KernelSU-Next" || true)
              echo "自动读取 KernelSU-Next 管理器版本号: ${KSUN_TARGET:-未取到}"
            fi
            fetch_setup "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" /tmp/ksun_setup.sh || { echo "::error title=ksun-setup::KernelSU-Next setup.sh 下载失败"; exit 1; }
            bash /tmp/ksun_setup.sh dev-susfs || { echo "::error title=ksun-setup::KernelSU-Next setup.sh 执行失败"; exit 1; }
            rm -f /tmp/ksun_setup.sh
            [ -d KernelSU-Next ] || { echo "::error title=ksun-setup::KernelSU-Next 源码目录不存在"; exit 1; }
            cd KernelSU-Next
            KSUN_TAG=""
            if [ -n "$KSUN_TARGET" ]; then
              KSUN_TAG=$(tag_by_version_local "." "$KSUN_TARGET" 30000 || true)
              [ -n "$KSUN_TAG" ] || KSUN_TAG=$(tag_by_version_api "KernelSU-Next/KernelSU-Next" "$KSUN_TARGET" || true)
              KSUN_HIT=0
              if [ -n "$KSUN_TAG" ]; then
                if git checkout "$KSUN_TAG"; then
                  echo "已把 KernelSU-Next 切到 tag $KSUN_TAG（版本 $KSUN_TARGET）"
                  KSUN_HIT=1
                fi
              fi
              if [ "$KSUN_HIT" = "0" ]; then
                KSUN_SHA=$(commit_by_version_api "pershoot/KernelSU-Next" "dev-susfs" "$KSUN_TARGET" 30000 || true)
                if [ -n "$KSUN_SHA" ]; then
                  git checkout "$KSUN_SHA" && echo "已把 KernelSU-Next 切到提交 $KSUN_SHA（版本 $KSUN_TARGET）" && KSUN_HIT=1
                fi
              fi
              if [ "$KSUN_HIT" = "0" ]; then
                echo "::warning title=ksu-ref::KernelSU-Next 无法定位版本 $KSUN_TARGET 的源码，源码保持分支最新（版本号仍按 $KSUN_TARGET 显示）"
              fi
            fi
            echo "KSUNext 实际提交: $(git rev-parse HEAD)"
            echo "::notice title=ksu-head::$(git rev-parse HEAD)"
            rm -rf .git
            if [ -n "$KSUN_TARGET" ]; then
              KSU_VERSION=$KSUN_TARGET
            else
              N=$(gh_curl -D - -o /dev/null "$GH_API/repos/pershoot/KernelSU-Next/commits?sha=dev&per_page=1" \
                  | tr -d '\r' | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
              N=${N:-1}
              KSU_VERSION=$((N + 30000))
            fi
            echo "KSU 版本号: $KSU_VERSION"
            echo "FORCE_KSU_VER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            force_kbuild_version "kernel/Kbuild" "$KSU_VERSION"
            KSU_GIT_TAG="${KSUN_TAG:-}"
            if [ -z "$KSU_GIT_TAG" ]; then
              KSU_GIT_TAG=$(tag_by_version_api "KernelSU-Next/KernelSU-Next" "$KSU_VERSION" || true)
            fi
            KSU_GIT_TAG=${KSU_GIT_TAG:-v0.0.1}
            sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := $KSU_GIT_TAG/g" kernel/Kbuild
            echo "写入 Kbuild 的版本兜底: $KSU_VERSION / tag $KSU_GIT_TAG"
            cd ../common/drivers/kernelsu
            if wget -q -O apk_sign.patch "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/other_patch/apk_sign.patch" && [ -s apk_sign.patch ]; then
              patch -p2 -N -F 3 < apk_sign.patch || true
            else
              echo "::warning title=apk-sign::apk_sign.patch 未获取到，跳过 WildKSU 管理器支持补丁"
            fi
          elif [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在配置原版 KernelSU (tiann/KernelSU)..."
            KSU_GH_TARGET="$KSU_TARGET"
            if [ -z "$KSU_GH_TARGET" ]; then
              KSU_GH_TARGET=$(gh_apk_version "tiann/KernelSU" || true)
              echo "自动读取 tiann/KernelSU 管理器版本号: ${KSU_GH_TARGET:-未取到}"
            fi
            fetch_setup "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" /tmp/ksu_orig_setup.sh || { echo "::error title=ksu-setup::KernelSU setup.sh 下载失败"; exit 1; }
            bash /tmp/ksu_orig_setup.sh main || { echo "::error title=ksu-setup::KernelSU setup.sh 执行失败"; exit 1; }
            rm -f /tmp/ksu_orig_setup.sh
            [ -d ./KernelSU ] || { echo "::error title=ksu-setup::KernelSU 源码目录不存在"; exit 1; }
            cd ./KernelSU
            KSU_TAG=""
            if [ -n "$KSU_GH_TARGET" ]; then
              KSU_TAG=$(tag_by_version_local "." "$KSU_GH_TARGET" 30000 || true)
              [ -n "$KSU_TAG" ] || KSU_TAG=$(tag_by_version_api "tiann/KernelSU" "$KSU_GH_TARGET" || true)
            fi
            if [ -n "$KSU_GH_TARGET" ]; then
              if [[ "${{ github.event.inputs.susfs_enable }}" == "true" ]]; then
                # 关键：susfs4oki 的 10_enable_susfs_for_ksu.patch 是针对 main 的文件结构写的
                # （它的上下文里有 #include "preinit/preinit.h"），切到旧 tag 会让补丁只打上一半，
                # 于是 init.c 里还留着 ksu_late_loaded / ksu_lsm_hook_init 的调用，而头文件里的声明已被补丁删掉
                # → "use of undeclared identifier"。所以开 SUSFS 时源码一律保持 main 最新，只把版本号钉成目标值。
                echo "检测到开启 SUSFS：KernelSU 源码保持 main 最新（旧 tag 会让 SUSFS 附加补丁只打上一半）"
                echo "版本号稍后由 force_kbuild_version 直接写进 Kbuild，管理器看到的仍然是 $KSU_GH_TARGET"
                echo "::notice title=ksu-ref::SUSFS 开启，源码保持 main，仅把内核内版本号对齐为 $KSU_GH_TARGET"
                # 版本号对了还不够：管理器首页那串「32680-5」「32680-6」的尾巴是 UAPI 版本号。
                # main 的 UAPI 是 6，而 v3.3.1（32680）官方管理器是 5，会让管理器提示「需要更新管理器」。
                # 这里把内核 UAPI 对齐成目标版本的 UAPI，两边就都是 -5。
                if [ -n "$KSU_TAG" ]; then
                  TARGET_UAPI=$(git show "$KSU_TAG:uapi/supercall.h" 2>/dev/null | sed -n 's/.*KERNEL_SU_UAPI_VERSION = \([0-9][0-9]*\).*/\1/p' | head -n 1)
                  CUR_UAPI=$(sed -n 's/.*KERNEL_SU_UAPI_VERSION = \([0-9][0-9]*\).*/\1/p' uapi/supercall.h 2>/dev/null | head -n 1)
                  echo "管理器 tag $KSU_TAG 的 UAPI: ${TARGET_UAPI:-未取到} / 当前 main 的 UAPI: ${CUR_UAPI:-未取到}"
                  if [ -n "$TARGET_UAPI" ] && [ "$TARGET_UAPI" != "$CUR_UAPI" ]; then
                    sed -i "s/\(KERNEL_SU_UAPI_VERSION = \)[0-9][0-9]*/\1$TARGET_UAPI/" uapi/supercall.h
                    echo "已把内核 UAPI 对齐为 $TARGET_UAPI：$(grep -m1 'KERNEL_SU_UAPI_VERSION = ' uapi/supercall.h)"
                    echo "::notice title=ksu-uapi::内核 UAPI 已对齐为 $TARGET_UAPI，管理器不会再提示需要更新"
                  else
                    echo "UAPI 无需调整（目标 $TARGET_UAPI / 当前 $CUR_UAPI）"
                  fi
                fi
              else
                KSU_HIT=0
                if [ -n "$KSU_TAG" ]; then
                  if git checkout "$KSU_TAG"; then
                    echo "已把 KernelSU 切到 tag $KSU_TAG（版本 $KSU_GH_TARGET）"
                    KSU_HIT=1
                  fi
                fi
                if [ "$KSU_HIT" = "0" ]; then
                  KSU_SHA=$(commit_by_version_api "tiann/KernelSU" "main" "$KSU_GH_TARGET" 30000 || true)
                  if [ -n "$KSU_SHA" ]; then
                    git checkout "$KSU_SHA" && echo "已把 KernelSU 切到提交 $KSU_SHA（版本 $KSU_GH_TARGET）" && KSU_HIT=1
                  fi
                fi
                if [ "$KSU_HIT" = "0" ]; then
                  echo "::warning title=ksu-ref::KernelSU 无法定位版本 $KSU_GH_TARGET 的源码，源码保持分支最新（版本号仍按 $KSU_GH_TARGET 显示）"
                fi
              fi
            fi
            echo "KSU 实际提交: $(git rev-parse HEAD)"
            echo "::notice title=ksu-head::$(git rev-parse HEAD)"
            if [ -n "$KSU_GH_TARGET" ]; then
              KSU_VERSION=$KSU_GH_TARGET
            else
              N=$(gh_curl -D - -o /dev/null "$GH_API/repos/tiann/KernelSU/commits?sha=main&per_page=1" \
                  | tr -d '\r' | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')
              N=${N:-1}
              KSU_VERSION=$((N + 30000))
            fi
            echo "KSU 版本号: $KSU_VERSION"
            echo "FORCE_KSU_VER=$KSU_VERSION" >> $GITHUB_ENV
            echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
            echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
            force_kbuild_version "kernel/Kbuild" "$KSU_VERSION"
          else
            echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
          fi

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        run: |
          cd kernel_workspace
          if [[ ${{ github.event.inputs.ksu_type }} != "none" ]]; then
            echo "正在添加susfs补丁..."
            SUSFS_OK=0
            for i in 1 2 3; do
              rm -rf susfs4ksu
              if timeout 300 git clone -b oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }} https://github.com/cctv18/susfs4oki.git susfs4ksu; then
                SUSFS_OK=1
                break
              fi
              echo "susfs4oki 克隆失败或超时（第 $i 轮），重试..."
              sleep 5
            done
            [ "$SUSFS_OK" = "1" ] || { echo "::error title=susfs-clone::susfs4oki 克隆失败"; exit 1; }
            echo "SUSFS 实际提交: $(git -C susfs4ksu rev-parse HEAD)"
            echo "::notice title=susfs-head::$(git -C susfs4ksu rev-parse HEAD)"
            cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
            cp ./susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ./susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cd ./common
            patch -p1 -F 3 < 50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
            echo "---- SUSFS 关键文件检查 ----"
            [ -f fs/susfs.c ] && echo "fs/susfs.c 已就位" || echo "fs/susfs.c 缺失"
            [ -f include/linux/susfs.h ] && echo "include/linux/susfs.h 已就位" || echo "include/linux/susfs.h 缺失"
            cd ..
          else
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksu" ]]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            KSU_SUSFS_PATCH=./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
            if [ -f "$KSU_SUSFS_PATCH" ]; then
              cp "$KSU_SUSFS_PATCH" ./KernelSU/
              cd ./KernelSU
              # 这个补丁是「整套换成老架构 + 接上 SUSFS」，只对特定 KernelSU 快照能 100% 打上。
              # 先 dry-run：只要有一个 hunk 打不上，就整体跳过并回滚，
              # 否则会出现「一半新一半旧」的混合代码（ksu_late_loaded / ksu_lsm_hook_init 未声明就是这么来的）。
              if patch -p1 -N --dry-run -F 3 < 10_enable_susfs_for_ksu.patch > /tmp/ksu_susfs_dryrun.log 2>&1; then
                patch -p1 -N -F 3 < 10_enable_susfs_for_ksu.patch > /tmp/ksu_susfs_apply.log 2>&1 || true
                if [ -n "$(find . -name '*.rej' -print -quit 2>/dev/null)" ]; then
                  echo "::warning title=ksu-susfs::补丁实际写入时有冲突，已回滚到打补丁前（内核侧 SUSFS 不受影响）"
                  find . -name '*.rej' -delete 2>/dev/null || true
                  find . -name '*.orig' -delete 2>/dev/null || true
                  git checkout -- . 2>/dev/null || true
                  git clean -fdq 2>/dev/null || true
                else
                  echo "SUSFS 附加补丁已完整打上（无 .rej）"
                  echo "::notice title=ksu-susfs::KernelSU 的 SUSFS 附加补丁已完整应用"
                fi
                rm -f 10_enable_susfs_for_ksu.patch
              else
                echo "::warning title=ksu-susfs::补丁与当前 KernelSU 版本不匹配（dry-run 未通过），已整体跳过：源码保持原样，内核侧 SUSFS 仍然生效，只是管理器里的 SUSFS 页面可能读不到数据"
                echo "---- dry-run 失败位置（前 15 行）----"
                head -n 15 /tmp/ksu_susfs_dryrun.log || true
                rm -f 10_enable_susfs_for_ksu.patch
              fi
              cd ..
            elif grep -rqi "susfs" ./KernelSU/kernel/ 2>/dev/null; then
              echo "KernelSU 源码已内置 SUSFS 调用点，无需附加补丁 —— 属正常情况"
              echo "::notice title=ksu-susfs::KernelSU 已内置 SUSFS 调用点，无需附加补丁（正常）"
            else
              echo "::warning title=ksu-susfs::未找到 KernelSU 的 SUSFS 附加补丁，且源码中也没检测到 SUSFS 调用点"
            fi
          fi
          if [[ ${{ github.event.inputs.ksu_type }} == "ksunext" ]]; then
            echo "正在检查 KernelSU Next 的 SUSFS 集成方式..."
            if [ -f ./susfs4ksu/kernel_patches/KernelSU-Next/10_enable_susfs_for_ksu_next.patch ]; then
              cp ./susfs4ksu/kernel_patches/KernelSU-Next/10_enable_susfs_for_ksu_next.patch ./KernelSU-Next/
              cd ./KernelSU-Next
              patch -p1 -F 3 < 10_enable_susfs_for_ksu_next.patch || true
              echo "已为 KernelSU-Next 打上 SUSFS 附加补丁"
            elif grep -rqi "susfs" ./KernelSU-Next/kernel/ 2>/dev/null; then
              echo "KernelSU-Next 源码已内置 SUSFS 调用点（pershoot dev-susfs 分支自带），无需附加补丁 —— 属正常情况"
              echo "::notice title=ksun-susfs::KernelSU-Next 已内置 SUSFS 调用点，无需附加补丁（正常）"
            else
              echo "::warning title=ksun-susfs::未找到 KernelSU-Next 的 SUSFS 附加补丁，且源码中也没检测到 SUSFS 调用点，SUSFS 可能不生效"
            fi
          fi

      - name: 修复 SUSFS 补丁在 6.12.69 上的错位(task_mmu)
        if: inputs.susfs_enable && inputs.ksu_type != 'none'
        run: |
          cd kernel_workspace/common
          python3 - <<'PYEOF'
          import re
          import sys

          p = "fs/proc/task_mmu.c"
          s = open(p, encoding="utf-8", errors="surrogateescape").read()
          orig_len = len(s)

          marker = "SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))"
          if "CONFIG_KSU_SUSFS_SUS_MAP" not in s:
              print("未检测到 SUS_MAP 补丁内容（本次可能没打 SUSFS 补丁），直接跳过修复")
              sys.exit(0)

          region_re = re.compile(
              r"([ \t]*)#ifdef[ \t]+CONFIG_KSU_SUSFS_SUS_MAP[ \t]*\r?\n(?:.*?\r?\n)*?[ \t]*#endif[^\n]*\r?\n",
              re.S,
          )

          cnt = {"goto": 0, "decl": 0, "block": 0}

          def classify(m):
              t = m.group(0)
              if "bypass_orig_flow" in t:
                  cnt["goto"] += 1
                  return ""
              if "struct vm_area_struct *vma;" in t:
                  cnt["decl"] += 1
                  return ""
              if marker in t and "return 0;" in t:
                  cnt["block"] += 1
                  return ""
              return t

          s = region_re.sub(classify, s)
          print("region removed:", cnt)

          s, n1 = re.subn(r"[ \t]*if[ \t]*\([^\n]*\)[ \t]*\{\r?\n[ \t]*goto[ \t]+bypass_orig_flow;[ \t]*\r?\n[ \t]*\}[ \t]*\r?\n", "", s)
          s, n2 = re.subn(r"[ \t]*if[ \t]*\([^\n]*\)[ \t]*\r?\n[ \t]*goto[ \t]+bypass_orig_flow;[ \t]*\r?\n", "", s)
          s, n3 = re.subn(r"[ \t]*goto[ \t]+bypass_orig_flow;[ \t]*\r?\n", "", s)
          s, n4 = re.subn(r"[ \t]*bypass_orig_flow:[ \t]*\r?\n", "", s)
          print("leftover removed: brace=%d if=%d goto=%d label=%d" % (n1, n2, n3, n4))

          A = ("#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
               "\tif (vma->vm_file) {\n"
               "\t\tif (SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
               "\t\t\treturn 0;\n"
               "\t}\n"
               "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n")

          anchor = ("static int show_smap(struct seq_file *m, void *v)\n"
                    "{\n"
                    "\tstruct vm_area_struct *vma = v;\n"
                    "\tstruct mem_size_stats mss = {};\n")

          if anchor in s:
              i = s.index(anchor) + len(anchor)
              s = s[:i] + A + "\n" + s[i:]
              print("inserted A into show_smap")
          else:
              print("WARN: show_smap anchor not found, skip insert")

          if "bypass_orig_flow" in s:
              print("ERROR: bypass_orig_flow still present in task_mmu.c")
          else:
              print("OK: no bypass_orig_flow left")

          print("---- 校验 ----")
          print("SUS_MAP 区段数量:", s.count("CONFIG_KSU_SUSFS_SUS_MAP"))
          print("goto 残留:", s.count("goto bypass_orig_flow"))

          open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)
          print("task_mmu.c repaired, size:", orig_len, "->", len(s))
          PYEOF

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace
          ZRAM_SRC_OK=0
          for i in 1 2 3; do
            rm -rf "$GITHUB_ACTOR"
